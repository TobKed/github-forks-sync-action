name: 'GitHub Forks Sync Action'
description: 'GitHub Action to synchronise forks'
author: 'TobKed'
branding:
  icon: upload-cloud
  color: green
inputs:
  github_token:
    description: 'Token for the repo. Can be passed in using $\{{ secrets.GITHUB_TOKEN }}'
    required: true
  upstream_repository:
    description: 'Repository name to clone.'
    required: true
  target_repository:
    description: 'Repository name to push. Default or empty value represents current github repository (${GITHUB_REPOSITORY})'
    default: ''
    required: false
  upstream_branch:
    description: 'Source branch from which changes will be pushed.'
    default: 'master'
    required: false
  target_branch:
    description: 'Destination branch to push changes.'
    default: 'master'
    required: false
  force:
    description: 'Determines if force push is used'
    required: false
  tags:
    description: 'Determines if --tags is used'
    required: false
runs:
  using: 'composite'
  steps:
    - run: "${GITHUB_ACTION_PATH}/start.sh"
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository }}
        INPUT_TARGET_REPOSITORY: ${{ inputs.target_repository }}
        INPUT_UPSTREAM_BRANCH: ${{ inputs.upstream_branch }}
        INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
        INPUT_FORCE: ${{ inputs.force }}
        INPUT_TAGS: ${{ inputs.tags }}
